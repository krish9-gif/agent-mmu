[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mmu"
version = "0.1.0"
description = "Deterministic, Cache-Pinned Memory Management Unit & Virtual Context Kernel for Autonomous AI Coding Agents"
readme = "README.md"
authors = [
    { name = "Krish Joshi", email = "krishjoshikrishjoshi9@gmail.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []
keywords = [
    "ai-agents",
    "context-window",
    "memory-management",
    "kv-cache",
    "prompt-caching",
    "swe-bench",
    "claude-code",
    "antigravity",
    "autonomous-agents"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Interpreters",
]

[project.urls]
Homepage = "https://github.com/krish9-gif/agent-mmu"
Repository = "https://github.com/krish9-gif/agent-mmu.git"
Tracker = "https://github.com/krish9-gif/agent-mmu/issues"

[project.scripts]
agent-mmu = "agent_mmu.cli:main"
agent-mmu-mcp = "agent_mmu.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
